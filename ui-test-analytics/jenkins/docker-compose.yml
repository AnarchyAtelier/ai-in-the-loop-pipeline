services:
  phantom-brew:
    image: node:22-bookworm-slim
    container_name: ui-test-analytics-phantom-brew
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    restart: unless-stopped
    environment:
      PORT: "3000"
      TS_NODE_TRANSPILE_ONLY: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../phantom-brew:/app
      - phantom_brew_node_modules:/app/node_modules

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: ui-test-analytics-jenkins:lts-playwright
    container_name: ui-test-analytics-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--httpPort=8080"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      RESULTS_ROOT: "/var/jenkins_results"
      BASE_URL: "http://phantom-brew:3000"
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    depends_on:
      - phantom-brew
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../results:/var/jenkins_results
    shm_size: "2gb"

volumes:
  jenkins_home:
  phantom_brew_node_modules:
